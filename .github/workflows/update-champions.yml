name: Actualizar Champions League

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: champions-data-sync
  cancel-in-progress: true

jobs:
  update-champions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-referees.txt

      - name: Instalar cliente HTTP
        run: python -m pip install -r scripts/requirements-referees.txt

      - name: Sincronizar clasificación UEFA
        run: python scripts/update_champions.py

      - name: Validar datos
        run: node --check champions-data.js

      - name: Publicar únicamente cambios oficiales
        run: |
          if git diff --quiet -- champions-data.js deportes.html; then
            echo "No hay cambios oficiales."
            exit 0
          fi
          git config user.name "WOLFGAMES Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- champions-data.js deportes.html
          git commit -m "Actualiza clasificación oficial de Champions"
          git push
