name: Actualizar Champions League

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: football-data-sync
  cancel-in-progress: false

jobs:
  update-champions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-referees.txt

      - name: Instalar cliente HTTP
        run: python -m pip install -r scripts/requirements-referees.txt

      - name: Sincronizar clasificación y resultados UEFA
        run: python scripts/update_champions.py

      - name: Validar datos
        run: |
          node --check champions-data.js
          node --check champions-fixtures.js
          node --check champions-draw.js
          node --check champions-centre.js

      - name: Ejecutar regresiones de fútbol
        run: node --test tests/regression.test.js

      - name: Publicar únicamente cambios oficiales
        run: |
          if git diff --quiet -- champions-data.js champions-fixtures.js deportes.html; then
            echo "No hay cambios oficiales."
            exit 0
          fi
          git config user.name "WOLFGAMES Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- champions-data.js champions-fixtures.js deportes.html
          git commit -m "Actualiza datos oficiales de Champions"
          git push
