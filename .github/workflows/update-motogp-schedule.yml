name: Actualizar horarios MotoGP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-motogp-schedule.yml"
      - "scripts/update_motogp_schedule.py"
      - "motogpcalendar.js"
      - "motogp-schedule-data.js"
      - "index.html"
      - "MotoGP.html"
      - "motogp-gp.html"
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"

permissions:
  contents: write

concurrency:
  group: motogp-schedule-sync
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-referees.txt

      - name: Instalar cliente HTTP
        run: python -m pip install requests==2.32.4

      - name: Sincronizar horarios oficiales
        run: python scripts/update_motogp_schedule.py

      - name: Validar archivo de horarios
        run: node --check motogp-schedule-data.js

      - name: Publicar solo si hay cambios
        run: |
          if git diff --quiet -- motogp-schedule-data.js index.html MotoGP.html motogp-gp.html; then
            echo "No hay horarios nuevos."
            exit 0
          fi
          git config user.name "WOLFGAMES Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- motogp-schedule-data.js index.html MotoGP.html motogp-gp.html
          git commit -m "Actualiza horarios oficiales de MotoGP"
          git push
