name: Actualizar árbitros RFEF

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: football-data-sync
  cancel-in-progress: false

jobs:
  update-referees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-referees.txt

      - name: Instalar lector RFEF
        run: python -m pip install -r scripts/requirements-referees.txt

      - name: Buscar designaciones oficiales
        run: python scripts/update_referees.py

      - name: Validar JavaScript
        run: node --check sports-data.js

      - name: Publicar solo si hay datos nuevos
        run: |
          if git diff --quiet -- sports-data.js deportes.html index.html; then
            echo "No hay designaciones nuevas."
            exit 0
          fi
          git config user.name "WOLFGAMES Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- sports-data.js deportes.html index.html
          git commit -m "Actualiza designaciones arbitrales RFEF"
          git push
