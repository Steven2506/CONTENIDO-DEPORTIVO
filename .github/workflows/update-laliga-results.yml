name: Actualizar resultados LALIGA

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: football-data-sync
  cancel-in-progress: true

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-referees.txt

      - name: Instalar cliente HTTP
        run: python -m pip install -r scripts/requirements-referees.txt

      - name: Sincronizar jornadas y partidos activos
        run: python scripts/update_laliga_results.py

      - name: Validar datos publicados
        run: |
          node --check sports-data.js
          node --check laliga-current.js
          node --check laliga-calendar.js

      - name: Ejecutar regresiones de fútbol
        run: node --test tests/regression.test.js

      - name: Publicar solo si hay cambios
        run: |
          printf '%s\n' '20260826-motogp-sessions' > .pages-deploy
          if git diff --quiet -- sports-data.js laliga-current.js laliga-calendar.js deportes.html index.html .pages-deploy; then
            echo "No hay cambios oficiales."
            exit 0
          fi
          git config user.name "WOLFGAMES Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- sports-data.js laliga-current.js laliga-calendar.js deportes.html index.html .pages-deploy
          git commit -m "Actualiza resultados oficiales de LALIGA"
          git push
