name: Actualizar resultados LALIGA

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: football-data-sync
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar cliente HTTP
        run: python -m pip install -r scripts/requirements-referees.txt

      - name: Sincronizar jornada actual
        run: python scripts/update_laliga_results.py

      - name: Validar datos publicados
        run: node --check sports-data.js

      - name: Publicar solo si hay cambios
        run: |
          if git diff --quiet -- sports-data.js deportes.html; then
            echo "No hay cambios oficiales."
            exit 0
          fi
          git config user.name "WOLFGAMES Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- sports-data.js deportes.html
          git commit -m "Actualiza resultados oficiales de LALIGA"
          git push
